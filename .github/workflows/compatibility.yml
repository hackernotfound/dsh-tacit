name: compatibility

on:
  schedule:
    - cron: "30 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dsh:
    name: dsh@${{ matrix.tag }}
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        tag: [latest, alpha]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.23.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Pack Tacit
        run: npm pack --json > "${RUNNER_TEMP}/dsh-tacit-pack.json"
      - name: Install into the dsh@${{ matrix.tag }} profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-tacit-compat-home
        run: |
          compatibility_tarball=$(node -e "const p=require(process.env.RUNNER_TEMP+'/dsh-tacit-pack.json'); process.stdout.write(p[0].filename)")
          npx --yes @deepseek-ai/dsh@${{ matrix.tag }} --version
          npx --yes @deepseek-ai/dsh@${{ matrix.tag }} plugin --profile web add "./${compatibility_tarball}"
      - name: Verify the installed plugin loads and uses the harness's own @deepseek-ai packages
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-tacit-compat-home
        run: |
          # The harness links its own @deepseek-ai packages into profiles/node_modules on boot.
          npx --yes @deepseek-ai/dsh@${{ matrix.tag }} web --port 0 > "${RUNNER_TEMP}/dsh-web.log" 2>&1 &
          web_pid=$!
          for _ in $(seq 1 60); do [ -d "${DSH_HOME}/profiles/node_modules/@deepseek-ai" ] && break; sleep 1; done
          node scripts/check-install.mjs "${DSH_HOME}/profiles/web"; status=$?
          kill "${web_pid}" 2>/dev/null || true
          exit "${status}"
