<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#f7f9fc"/><stop offset="1" stop-color="#eaf1fb"/></linearGradient></defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="Helvetica, Arial, sans-serif">
    <text x="96" y="72" font-size="30" fill="#246bdb" font-weight="700">Tacit</text>
    <text x="173" y="72" font-size="30" fill="#172033" font-weight="700">for DeepSeek Harness</text>
    <rect x="1044" y="40" width="140" height="44" rx="22" fill="#fff" stroke="#dbe3ef"/>
    <text x="1073" y="69" font-size="20" fill="#4b5d73" font-weight="600">v0.7.0</text>
    <circle cx="113" cy="133" r="17" fill="#246bdb"/>
    <text x="108" y="139" font-size="17" fill="#fff" font-weight="700">1</text>
    <text x="145" y="141" font-size="21" fill="#246bdb" font-weight="700">Install or update</text>
    <text x="96" y="211" font-size="44" fill="#172033" font-weight="700">Add Tacit in one command.</text>

    <rect x="96" y="252" width="1088" height="310" rx="19" fill="#111827" stroke="#111827"/>
    <path d="M115 252h1050a19 19 0 0 1 19 19v30H96v-30a19 19 0 0 1 19-19z" fill="#1c293e"/>
    <circle cx="128" cy="277" r="6" fill="#ff8d86"/><circle cx="151" cy="277" r="6" fill="#ffd166"/><circle cx="174" cy="277" r="6" fill="#66dbad"/>
    <g font-family="Menlo, Consolas, monospace">
      <text x="126" y="355" font-size="23" fill="#79b8ff" font-weight="400">$</text>
      <text x="158" y="355" font-size="23" fill="#e5edf8" font-weight="400">npx @deepseek-ai/dsh plugin --profile web add dsh-tacit</text>
      <text x="126" y="408" font-size="23" fill="#95a9c2" font-weight="400">dependencies:</text>
      <text x="126" y="457" font-size="24" fill="#80e3b3" font-weight="400">+ dsh-tacit 0.7.0</text>
      <text x="126" y="518" font-size="22" fill="#e5edf8" font-weight="400">Restart dsh web, then refresh the page.</text>
    </g>
    <text x="96" y="594" font-size="23" fill="#42566e" font-weight="400">Supports DSH 0.2. Current DSH needs Node 24.9 or newer.</text>

    <text x="96" y="626" font-size="21" fill="#42566e" font-weight="400">Reports stay local. Analysis makes paid calls through your configured provider.</text>
    <text x="96" y="674" font-size="17" fill="#61748c" font-weight="400">Illustrated walkthrough · example data</text>
    <text x="810" y="674" font-size="17" fill="#61748c" font-weight="400">github.com/hackernotfound/dsh-tacit</text>
  </g>
</svg>
