<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7f9fc"/>
      <stop offset="1" stop-color="#eaf1fb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#23334e" flood-opacity="0.2"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="120" y="90" font-size="30" font-weight="750" fill="#246bdb">Tacit</text>
    <text x="192" y="90" font-size="30" font-weight="750" fill="#121826">for DeepSeek Harness</text>
    <rect x="1048" y="55" width="112" height="44" rx="22" fill="#fff" stroke="#cfdae9"/>
    <text x="1104" y="83" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" font-weight="600" fill="#4b5d73">v0.2.1</text>

    <circle cx="137" cy="154" r="17" fill="#246bdb"/>
    <text x="137" y="160" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">1</text>
    <text x="168" y="161" font-size="19" font-weight="700" fill="#246bdb">Install</text>
    <text x="120" y="226" font-size="50" font-weight="780" letter-spacing="-1.5" fill="#121826">Add Tacit in one command.</text>

    <g filter="url(#shadow)">
      <rect x="120" y="275" width="1040" height="300" rx="19" fill="#111827"/>
      <path d="M139 275h1002a19 19 0 0 1 19 19v30H120v-30a19 19 0 0 1 19-19z" fill="#182235"/>
      <circle cx="151" cy="300" r="6" fill="#ff6b6b"/>
      <circle cx="174" cy="300" r="6" fill="#ffd166"/>
      <circle cx="197" cy="300" r="6" fill="#06d6a0"/>
    </g>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="500">
      <text x="160" y="382" fill="#58a6ff">$</text>
      <text x="190" y="382" fill="#e5edf8">dsh plugin --profile web add dsh-tacit</text>
      <text x="160" y="434" fill="#8ca0bb">dependencies:</text>
      <text x="160" y="486" fill="#72e0a8">+</text>
      <text x="190" y="486" fill="#e5edf8">dsh-tacit 0.2.1</text>
      <text x="160" y="538" fill="#72e0a8">Done</text>
    </g>
    <text x="120" y="633" font-size="18" font-weight="700" fill="#182235">Local learning.</text>
    <text x="246" y="633" font-size="18" fill="#586b82">Your profile stays on your machine.</text>
    <text x="1160" y="633" text-anchor="end" font-size="17" fill="#586b82">github.com/hackernotfound/dsh-tacit</text>
  </g>
</svg>
